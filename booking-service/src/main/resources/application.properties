# Application Name
spring.application.name=booking-service
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/bookingdb
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging
logging.level.com.ticketmaster.booking=DEBUG
logging.level.org.springframework.security=DEBUG

# Booking Timer
booking.expiration.minutes=15

# External Services (REST - deprecated, switching to gRPC)
#event-service.url=http://localhost:8082

# gRPC Client Configuration
grpc.client.event-service.address=static://localhost:9090
grpc.client.event-service.negotiationType=PLAINTEXT
grpc.client.event-service.enableKeepAlive=true
grpc.client.event-service.keepAliveTime=30s
grpc.client.event-service.keepAliveTimeout=5s

# Basic Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Set a default expiration time for redis
spring.redis.time-to-live=600000   #10 minutes in milliseconds
# Redis Cache Configuration
spring.cache.type=redis